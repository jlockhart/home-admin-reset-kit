name: Home Admin Reset Kit trial feedback
description: Public feedback for the Home Admin Reset Kit trial. Do not include private documents or sensitive details.
title: "Home Admin Reset Kit trial feedback"
labels: ["intake", "trial-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the Home Admin Reset Kit. Please keep feedback general. Do not include private documents, account numbers, IDs, tax records, legal papers, receipts, or financial details.
  - type: textarea
    id: paperwork-pain
    attributes:
      label: What paperwork or home-admin task is currently most annoying, messy, or hard to find?
    validations:
      required: true
  - type: dropdown
    id: person-type
    attributes:
      label: Which best describes you?
      options:
        - Homeowner
        - Renter
        - Sole trader / contractor
        - Family admin person
        - Helping parents or another household
        - Other
    validations:
      required: true
  - type: dropdown
    id: most-useful
    attributes:
      label: What would be most useful to you?
      options:
        - A simple folder/spreadsheet/checklist template kit
        - A guided setup call
        - A done-for-you setup service
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: general-feedback
    attributes:
      label: General feedback, missing pieces, or pricing reaction
      description: Keep this general. Do not include sensitive/private details.
    validations:
      required: false
